name: build

on:
  push:
    branches: [main]
    paths:
      - 'm-server/**'
      - 'LocalDataServer.exe'
      - 'LocalDataServer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: m-server

    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: m-server/go.sum

      - name: 固定依赖版本
        run: go get github.com/guohuiyuan/go-music-dl@v1.1.3

      - name: 整理依赖
        run: go mod tidy

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o ../m-server.exe .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: m-server-exe
          path: m-server.exe
          if-no-files-found: error

      - name: 上传依赖锁定文件
        uses: actions/upload-artifact@v4
        with:
          name: m-deps
          path: |
            m-server/go.mod
            m-server/go.sum
          if-no-files-found: warn

      # main 分支每次成功构建都更新同一个 Release，
      # 使用者永远从「最新构建」拿 exe，不需要等人工发布。
      - name: 发布最新构建
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: 最新构建
          body: |
            由 GitHub Actions 自动构建，随 `main` 分支更新。

            **两个文件都下下来，放在同一个目录里**，双击各自的 exe 即可。
            不需要安装 Go 或任何运行时。

            `m-server.exe` —— 在线搜索 / 歌单服务（可选，只要本地播放可以不运行）

            - 静默启动，不弹命令行窗口
            - 日志写到同目录的 `m-server.log`（超过 4MB 会转存为 `.old`）
            - 端口从 `17650` 开始自动找，页面会自己探测
            - 首次运行会在同级目录建 `data/m/` 存歌单
            - 停止：任务管理器结束 `m-server.exe`，或命令行 `taskkill /IM m-server.exe /F`

            `LocalDataServer.exe` —— 本地数据与音频服务（必需）

            - 页面读写本地 JSON、播放 `data/music/` 里的歌都靠它
            - 端口从 `17632` 开始自动找
            - 提供系统音量接口 `/api/audio/volume`（v1.4 起）
            - 停止：任务管理器结束 `LocalDataServer.exe`，或 `taskkill /IM LocalDataServer.exe /F`

            构建自 `${{ github.sha }}`
          files: |
            m-server.exe
            LocalDataServer.exe
          overwrite_files: true
          make_latest: true

      # 打 tag 时额外发一个带版本号的 Release
      - name: 发布版本
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            m-server.exe
            LocalDataServer.exe
