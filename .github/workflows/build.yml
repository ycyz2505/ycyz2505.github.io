name: build

on:
  push:
    branches: [main]
    paths:
      - 'm-server/**'
      - 'LocalDataServer.exe'
      - 'LocalDataServer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: m-server

    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: m-server/go.sum

      - name: 固定依赖版本
        run: go get github.com/guohuiyuan/go-music-dl@v1.1.3

      - name: 整理依赖
        run: go mod tidy

      - name: 静态检查
        run: go vet ./...

      - name: 编译 m-server
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o ../m-server.exe .

      - name: 准备 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 编译 LocalDataServer
        working-directory: LocalDataServer
        run: cl /nologo /utf-8 /O2 /MT /EHsc /DNDEBUG /Brepro LocalDataServer.cpp /link /SUBSYSTEM:WINDOWS ws2_32.lib ole32.lib propsys.lib winhttp.lib bcrypt.lib /OUT:..\LocalDataServer.exe

      # 两个 exe 各有独立版本号；清单分别给出各自的版本、下载地址与 SHA-256。
      # 客户端只在自己的版本落后时才下载自己的文件。
      - name: 生成更新清单
        working-directory: .
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          $mver = [regex]::Match((Get-Content -LiteralPath 'm-server/main.go' -Raw), 'appVersion\s*=\s*"([^"]+)"').Groups[1].Value
          $lver = [regex]::Match((Get-Content -LiteralPath 'LocalDataServer/LocalDataServer.cpp' -Raw), 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $mver -or -not $lver) { throw '版本号读取失败' }

          $base = "https://github.com/$env:REPO/releases/download/build-latest"

          $manifest = [ordered]@{
            'm-server' = [ordered]@{
              version = $mver
              url     = "$base/m-server.exe"
              sha256  = (Get-FileHash -LiteralPath 'm-server.exe' -Algorithm SHA256).Hash.ToLower()
            }
            'local-data-server' = [ordered]@{
              version = $lver
              url     = "$base/LocalDataServer.exe"
              sha256  = (Get-FileHash -LiteralPath 'LocalDataServer.exe' -Algorithm SHA256).Hash.ToLower()
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 4
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'manifest.json'), $json, $utf8)
          Get-Content -LiteralPath 'manifest.json'

      - name: 上传 m-server
        uses: actions/upload-artifact@v4
        with:
          name: m-server-exe
          path: m-server.exe
          if-no-files-found: error

      - name: 上传 LocalDataServer
        uses: actions/upload-artifact@v4
        with:
          name: local-data-server-exe
          path: LocalDataServer.exe
          if-no-files-found: error

      - name: 上传更新清单
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: manifest.json
          if-no-files-found: error

      - name: 上传依赖锁定文件
        uses: actions/upload-artifact@v4
        with:
          name: m-deps
          path: |
            m-server/go.mod
            m-server/go.sum
          if-no-files-found: warn

      # main 分支每次成功构建都更新同一个 Release，
      # 使用者永远从「最新构建」拿 exe，不需要等人工发布。
      - name: 发布最新构建
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: 最新构建
          body: |
            由 GitHub Actions 自动构建，随 `main` 分支更新。

            **两个文件都下下来，放在同一个目录里**，双击各自的 exe 即可。
            不需要安装 Go 或任何运行时。

            **自动更新**：两个 exe 启动时都会读取本 Release 的 `manifest.json`，
            各自的版本号独立；只有自己的版本低于清单时才会下载自己的文件。
            下载会依次尝试 `ghfast.top`、`gh-proxy.com`、`ghproxy.net` 加速源，最后才直连 GitHub。
            更新状态写在 exe 同目录的 `m-server.log` / `LocalDataServer-update.txt`。

            `m-server.exe` —— 在线搜索 / 歌单服务（可选，只要本地播放可以不运行）

            - 静默启动，不弹命令行窗口
            - 同一时间只允许运行一个实例
            - 日志写到同目录的 `m-server.log`（超过 4MB 会转存为 `.old`）
            - 端口从 `17650` 开始自动找，页面会自己探测
            - 首次运行会在同级目录建 `data/m/` 存歌单
            - 停止：任务管理器结束 `m-server.exe`，或命令行 `taskkill /IM m-server.exe /F`

            `LocalDataServer.exe` —— 本地数据与音频服务（必需）

            - 页面读写本地 JSON、播放 `data/music/` 里的歌都靠它
            - 同一时间只允许运行一个实例
            - 端口从 `17632` 开始自动找
            - 提供系统音量接口 `/api/audio/volume`
            - 停止：任务管理器结束 `LocalDataServer.exe`，或 `taskkill /IM LocalDataServer.exe /F`

            构建自 `${{ github.sha }}`
          files: |
            m-server.exe
            LocalDataServer.exe
            manifest.json
          overwrite_files: true
          make_latest: true

      # 打 tag 时额外发一个带版本号的 Release
      - name: 发布版本
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            m-server.exe
            LocalDataServer.exe
            manifest.json

      # 让仓库根目录的 LocalDataServer.exe（网页上的下载按钮）也保持最新。
      # /Brepro 让构建可复现：源码没变时 exe 不变，不会产生无意义的提交。
      - name: 回写 LocalDataServer.exe
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        working-directory: .
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- LocalDataServer.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: 更新 LocalDataServer.exe [skip ci]"
            git push
          }
