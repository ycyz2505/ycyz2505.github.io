name: build

on:
  push:
    branches: [main]
    paths:
      - 'm-server/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: m-server

    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: 固定依赖版本
        run: go get github.com/guohuiyuan/go-music-dl@v1.1.3

      - name: 整理依赖
        run: go mod tidy

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build -trimpath -ldflags "-s -w" -o ../m-server.exe .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: m-server-exe
          path: m-server.exe
          if-no-files-found: error

      # main 分支每次成功构建都更新同一个 Release，
      # 使用者永远从「最新构建」拿 exe，不需要等人工发布。
      - name: 发布最新构建
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: 最新构建
          body: |
            由 GitHub Actions 自动构建，随 `main` 分支更新。

            **用法**：下载 `m-server.exe`，放到 `LocalDataServer.exe` 同一个目录，双击运行。
            不需要安装 Go 或任何运行时。

            - 端口从 `17650` 开始自动找，页面会自己探测
            - 首次运行会在同级目录建 `data/m/` 存歌单
            - 只想用本地播放可以不运行它

            构建自 `${{ github.sha }}`
          files: m-server.exe
          overwrite_files: true
          make_latest: true

      # 打 tag 时额外发一个带版本号的 Release
      - name: 发布版本
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: m-server.exe
